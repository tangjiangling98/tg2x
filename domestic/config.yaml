# ============================================================
# XjianglinX 国内平台分发配置（本机常驻运行）
# 作用：把 @YMISH3333 频道的「中文原文」排版后，同步到公众号草稿箱 + 小红书
# 注意：与 X 账号的英文链路完全独立，互不影响
# ============================================================

# 要搬运的频道（不带 @），中文原文来源
channel: "YMISH3333"

# 中文原文数据源（本机访问不了 t.me，从 tg2x 仓库拉取已导出的中文原文）
feed:
  repo: "tangjun937/tg2x"
  path: "data/cn_feed.json"

# 每轮扫描间隔（分钟）
interval_minutes: 30

# 单次最多处理多少条新帖（只搬最新的）
max_per_cycle: 1

# ---------- 公众号（只推草稿箱，最后发布需在手机公众号后台确认） ----------
wechat:
  enabled: false
  # 公众号后台登录 Cookie：浏览器登录 mp.weixin.qq.com 后，按 README 指引复制
  cookie: ""
  # 认证指纹（通常无需改；如保存草稿报 invalid csrf，可从后台请求里抓一个更新）
  fingerprint: "35dc47301bd07b69891ae7968e00661d"
  # 文章作者署名（留空则不填作者）
  author: ""

# ---------- 小红书（真实发布，强制配图；风控较严，谨慎启用） ----------
xhs:
  enabled: false
  # 小红书创作中心登录 Cookie：登录 creator.xiaohongshu.com 后按 README 复制
  cookie: ""
  # 笔记标题（留空则用快讯第一句截断作为标题）
  title: ""
  # 话题标签（不带 #），可留空
  topics: []
  # 内容声明：可填 "笔记含AI合成内容" / "虚构演绎，仅供娱乐" / "内容包含营销广告"，留空不声明
  content_declaration: "笔记含AI合成内容"

# ---------- 配图（小红书强制要图，公众号用同图做封面） ----------
cover:
  # 卡片宽度（小红书竖版 3:4，建议 1080x1440）
  width: 1080
  height: 1440
  # 中文字体路径（Windows 默认微软雅黑；留空自动探测）
  font_path: ""
  # 配色主题：可选 "tech" / "finance" / "simple"
  theme: "tech"
  # 底部来源标注（留空则不显示）
  source: "全球大事件曝光"
